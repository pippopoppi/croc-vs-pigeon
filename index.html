<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1b2a36; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; }
  canvas { display: block; touch-action: none; }
  .hidden { display: none !important; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 18px; background: rgba(27, 42, 54, 0.92); text-align: center; }
  .brand { font-size: 11px; letter-spacing: 3px; color: #a0d779; }
  h2 { margin: 0; font-size: clamp(26px, 8vw, 36px); line-height: 1.1; color: #fff; }
  .label { font-size: 11px; letter-spacing: 3px; color: #9fb3c9; margin-top: 6px; }
  .big { font-size: clamp(40px, 14vw, 64px); font-weight: 800; line-height: 1; color: #ffd84a; }
  .big.white { color: #fff; }
  .tag { font-style: italic; color: #d9ecf7; font-size: 14px; max-width: 300px; }
  .best { font-size: 12px; color: #9fb3c9; }
  .btn { appearance: none; border: 3px solid #fff; cursor: pointer; font: inherit; font-weight: 800; letter-spacing: 2px; color: #1b2a36; padding: 12px 18px; background: #ffd84a; font-size: 15px; min-width: 240px; box-shadow: 4px 4px 0 #000; text-decoration: none; display: inline-block; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
  .btn.green { background: #a0d779; }
  .btn.x { background: #000; color: #fff; }
  .link { background: none; border: 0; color: #9fb3c9; font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 6px; }
  .screen { overflow-y: auto; }
  #start { background: rgba(27, 42, 54, 0.82); gap: 8px; }
  #end { gap: 7px; padding: 16px 18px; }
  #end .big { font-size: clamp(36px, 12vw, 54px); }
  .nick { width: 240px; max-width: 100%; border: 3px solid #fff; background: #10202c; color: #ffd84a; font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-align: center; text-transform: uppercase; padding: 8px 10px; outline: none; box-shadow: 4px 4px 0 #000; }
  .nick::placeholder { color: #5f7890; font-weight: 600; letter-spacing: 1px; }
  .nick:focus { border-color: #ffd84a; }
  .nick.shake { animation: shake 0.3s; border-color: #ff4d5e; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .board { list-style: none; margin: 0; padding: 0; width: 300px; max-width: 100%; font-size: 13px; }
  .board li { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 6px; }
  .board li:nth-child(odd) { background: rgba(255, 255, 255, 0.05); }
  .board .pos { width: 22px; color: #9fb3c9; text-align: right; font-weight: 800; }
  .board .name { flex: 1; text-align: left; font-weight: 800; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .pts { color: #ffd84a; font-weight: 800; }
  .board .sub { color: #9fb3c9; font-size: 11px; width: 52px; text-align: right; }
  .board li.me { background: rgba(255, 216, 74, 0.18); outline: 1px solid rgba(255, 216, 74, 0.5); }
  .board li.empty { justify-content: center; color: #9fb3c9; font-style: italic; }
  .board li:nth-child(1) .pos { color: #ffd84a; } .board li:nth-child(2) .pos { color: #d8dde3; } .board li:nth-child(3) .pos { color: #d79b5a; }
  .rank { font-size: 14px; font-weight: 800; color: #a0d779; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="720"></canvas>

  <div id="start" class="screen">
    <div class="brand">PIPPO POPPI GAMES</div>
    <h2>CHI SEI?</h2>
    <input class="nick" id="nick" maxlength="12" placeholder="IL TUO NOME" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="btn green" id="btn-play">GIOCA</button>
    <div class="label" id="board-title">CLASSIFICA</div>
    <ol class="board" id="board"></ol>
    <div class="best" id="board-note"></div>
    <div class="best" id="visits" hidden></div>
  </div>

  <div id="end" class="screen hidden">
    <div class="brand">PIPPO POPPI GAMES — FINAL RESULT</div>
    <h2 id="end-title">YOU GOT PIGEONED. 🐦</h2>
    <div class="label">TIME SURVIVED</div>
    <div class="big white" id="end-time">0s</div>
    <div class="label">FINAL SCORE</div>
    <div class="big" id="end-score">0</div>
    <div class="label">PIGEONS EATEN</div>
    <div class="big white" id="end-eaten">0</div>
    <div class="tag" id="end-tag"></div>
    <div class="rank" id="end-rank"></div>
    <div class="best" id="end-best"></div>
    <button class="btn" id="btn-copy">COPY X CHALLENGE</button>
    <a class="btn x" id="btn-share" href="#" target="_blank" rel="noopener">𝕏 POST THE CHALLENGE</a>
    <button class="btn green" id="btn-again">ANCORA UNA PARTITA</button>
    <div><button class="link" id="btn-board">🏆 Classifica / cambia nome</button><button class="link" id="btn-sound">🔊 Sound on</button></div>
  </div>
</div>
<script src="game.js"></script>
<script>
(function(){var n=document.getElementById('visits');if(!n||!window.fetch)return;fetch('https://pippopoppi.goatcounter.com/counter/'+location.pathname+'.json').then(function(r){return r.ok?r.json():null;}).then(function(d){var c=d&&String(d.count||'');if(!c||c==='0')return;n.textContent=c==='1'?'Giocato 1 volta':'Giocato '+c+' volte';n.hidden=false;n.dataset.ok='1';}).catch(function(){});})();
</script>
<!-- Visitor count (GoatCounter: no cookies, no personal data) -->
<script data-goatcounter="https://pippopoppi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
